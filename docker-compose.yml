version: '3.8'
services:
  comfort-player:
    image: ghcr.io/rittme/comfort-player:latest
    container_name: comfort-player
    # To let the server reach TVs on your LAN and see their real IPs, you can
    # use host networking instead of the ports mapping (Linux hosts). Docker
    # then ignores ports:, and PORT alone picks the port:
    # network_mode: host
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - MEDIA_DIR=/app/media
      - SEASONS_DIR=/app/media/shows
      - STATE_FILE=/app/data/state.json
      - SETTINGS_FILE=/app/data/settings.json
      - REMOTE_CERT_DIR=/app/data/atvremote
      - API_KEY=${API_KEY:-your-secret-token}
      - VIDEO_FILE_PATTERN=*.mp4,*.mkv,*.avi
      - SUBTITLE_FILE_PATTERN=*.srt,*.vtt
    volumes:
      - ./media:/app/media:ro # Mount media folder as external volume
      - ./data:/app/data # Mount data folder as external volume for persistent state
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-8080}/api/show/info || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
